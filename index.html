.q{padding:20px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:4px}
.qh{display:flex;gap:12px;margin-bottom:14px}
.qn{flex:0 0 auto;font-size:13px;color:var(--sage);padding-top:2px}
.qt{flex:1;font-size:15.5px;line-height:1.5}

.opts.stack{flex-direction:column}
.opt{

  padding:12px 8px;text-align:center;cursor:pointer;font-size:13px;color:var(--slate);

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function set(k,v){ans[k]=v;queueSave();}
function get(k){return ans[k];}

function optRow(key,opts,stack){
  var h='<div class="opts'+(stack?' stack':'')+'" data-key="'+key+'">';
  opts.forEach(function(o){
    var on = String(get(key))===String(o.v);
    h+='<button type="button" class="opt" role="button" aria-pressed="'+on+'" data-v="'+esc(o.v)+'">'
      +(o.n?'<span class="n">'+o.n+'</span>':'')+'<span>'+esc(o.l)+'</span></button>';
  });
  return h+'</div>';
}
function item(no,key,txt,opts,stack){
  return '<div class="q" data-req="'+key+'"><div class="qh"><span class="qn mono">'+no+'</span>'
    +'<span class="qt">'+esc(txt[0])+'<span class="en">'+esc(txt[1])+'</span></span></div>'
    +optRow(key,opts,stack)+'</div>';
}

function bindRep(hostId,key,pa,pb){
  var host=document.getElementById(hostId);
  if(!host)return;
  function draw(){
    host.innerHTML = demo[key].map(function(r,i){
      return '<div class="rep"><input type="text" placeholder="'+pa+'" value="'+esc(r.a)+'" data-i="'+i+'" data-f="a">'
           + '<input type="text" placeholder="'+pb+'" value="'+esc(r.b)+'" data-i="'+i+'" data-f="b"></div>';
    }).join('') + (demo[key].length<5?'<button type="button" class="addbtn">+ Tambah baris</button>':'');
    host.querySelectorAll('input').forEach(function(el){
      el.addEventListener('input',function(){demo[key][+el.dataset.i][el.dataset.f]=el.value;queueSave();});
    });
    var ab=host.querySelector('.addbtn');
    if(ab)ab.addEventListener('click',function(){demo[key].push({a:'',b:''});draw();});
  }
  draw();
}

function render(){
  var s=screens[idx];
  document.body.dataset.view='survey';
  app.innerHTML=s.html();
  var names={intro:'Pengenalan',A:'Demografi',B:'Pengetahuan',C:'Sikap',D:'Amalan'};
  var trail=document.createElement('ol');
  trail.className='section-trail';
  trail.setAttribute('aria-label','Kemajuan borang');
  trail.innerHTML=screens.map(function(screen,i){
    return '<li class="'+(i===idx?'active':(i<idx?'complete':''))+'"'+(i===idx?' aria-current="step"':'')+'><span class="trail-number">0'+(i+1)+'</span><span class="trail-label">'+names[screen.id]+'</span></li>';
  }).join('');
  app.prepend(trail);
  if(s.id!=='intro') app.querySelector('.card').classList.add('section-heading');
  window.scrollTo(0,0);

  app.querySelectorAll('.opts[data-key]').forEach(function(g){
    g.querySelectorAll('.opt').forEach(function(b){
      b.addEventListener('click',function(){
        g.querySelectorAll('.opt').forEach(function(x){x.setAttribute('aria-pressed','false');});
        b.setAttribute('aria-pressed','true');
        var q=g.closest('.q'); if(q)q.classList.remove('err');
        set(g.dataset.key,b.dataset.v);
      });
    });
  });
  app.querySelectorAll('.opts[data-demo]').forEach(function(g){
    g.querySelectorAll('.opt').forEach(function(b){
      b.addEventListener('click',function(){
        g.querySelectorAll('.opt').forEach(function(x){x.setAttribute('aria-pressed','false');});
        b.setAttribute('aria-pressed','true');
        demo[g.dataset.demo]=b.dataset.v; queueSave();
        if(g.dataset.demo==='pernahRespon')
          document.getElementById('wrapBencana').classList.toggle('hidden',b.dataset.v!=='Ya');
        if(g.dataset.demo==='pernahLatihan')
          document.getElementById('wrapLatihan').classList.toggle('hidden',b.dataset.v!=='Ya');
      });
    });
  });
  app.querySelectorAll('.opts[data-multi]').forEach(function(g){
    g.querySelectorAll('.opt').forEach(function(b){
      b.addEventListener('click',function(){
        var on=b.getAttribute('aria-pressed')==='true';
        b.setAttribute('aria-pressed',String(!on));
        var v=b.dataset.v, i=demo.latihan.indexOf(v);
        if(on&&i>-1)demo.latihan.splice(i,1); else if(!on&&i===-1)demo.latihan.push(v);
        queueSave();
      });
    });
  });

  if(s.after)s.after();
  // Associate existing form controls with their visible instructions.
  var age=document.getElementById('d_umur'), prof=document.getElementById('d_prof');
  [age,prof].forEach(function(el){if(el&&el.previousElementSibling)el.previousElementSibling.setAttribute('for',el.id);});
  app.querySelectorAll('input[placeholder]').forEach(function(el){el.setAttribute('aria-label',el.placeholder);});
  var heading=app.querySelector('h1,h2');
  if(heading){heading.setAttribute('tabindex','-1');heading.focus({preventScroll:true});}

  btnBack.classList.toggle('hidden',idx===0);
  btnNext.textContent = (idx===screens.length-1) ? 'Hantar jawapan' : 'Seterusnya';
  foot.classList.remove('hidden');
  document.getElementById('step').textContent='Bahagian '+(idx+1)+' daripada '+screens.length;
  progress(idx/screens.length);
}

function progress(p){
  var pct=Math.max(0,Math.min(1,p))*100;
  document.getElementById('fill').style.width=pct+'%';
  document.getElementById('crest').style.left=pct+'%';
}

function validate(){
  var s=screens[idx], bad=null;
  app.querySelectorAll('.q[data-req]').forEach(function(q){
    var k=q.dataset.req;
    if(ans[k]===undefined||ans[k]===''){ q.classList.add('err'); if(!bad)bad=q; }
  });
  if(bad){
    bad.scrollIntoView({behavior:'smooth',block:'center'});
    flash('Sila jawab semua item sebelum meneruskan.');
    return false;
  }
  if(s.validate){
    var m=s.validate();
    if(m){ flash(m); return false; }
  }
  return true;
}

function flash(msg){
  var e=document.getElementById('saved');
  e.textContent=msg; e.style.color='#B91C1C'; e.style.opacity='1';
  setTimeout(function(){e.style.opacity='0';e.style.color='';},3200);
}

btnNext.addEventListener('click',function(){
  if(idx>0 && !validate()) return;
  if(idx<screens.length-1){ idx++; render(); return; }
  submit();
});
btnBack.addEventListener('click',function(){ if(idx>0){idx--;render();} });

/* ============ AUTOSAVE ============ */
function queueSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    apiCall('simpanDraf', {
      token:STATE.token,
      tp:STATE.stage,
      data:JSON.stringify({ans:ans,demo:demo})
    }, function(r){
      if(r&&r.ok){
        var e=document.getElementById('saved');
        e.textContent='Disimpan'; e.style.opacity='1';
        setTimeout(function(){e.style.opacity='0';},1400);
      }
    });
  },1400);
}

/* ============ HANTAR ============ */
function submit(){
  if(sending)return;
  sending=true;
  btnNext.disabled=true;
  btnNext.textContent='Menghantar…';

  if(demo.tempat) demo.tempatStr = demo.tempat.filter(function(r){return r.a;}).map(function(r){return r.a+' ('+r.b+')';}).join('; ');
  if(demo.bencana) demo.bencanaStr = demo.bencana.filter(function(r){return r.a;}).map(function(r){return r.a+' ('+r.b+')';}).join('; ');

  var payload = STATE.stage==='T0' ? {
    umur:demo.umur, jantina:demo.jantina, pendidikan:demo.pendidikan, profesion:demo.profesion||'',
    tempat:demo.tempatStr||'', pernahRespon:demo.pernahRespon,
    senaraiBencana:demo.bencanaStr||'', pernahLatihan:demo.pernahLatihan,
    jenisLatihan:(demo.latihan||[]).join('; ')
  } : null;

  var dur = Math.round((Date.now()-t0)/1000);
  apiCall('hantar', {
    token:STATE.token,
    tp:STATE.stage,
    data:JSON.stringify(ans),
    demo:payload ? JSON.stringify(payload) : '',
    dur:String(dur)
  }, function(r){
    if(r&&r.ok) done();
    else { sending=false; btnNext.disabled=false; btnNext.textContent='Hantar jawapan'; flash((r&&r.msg)||'Penghantaran gagal. Sila cuba lagi.'); }
  });
}

function done(){
  document.body.dataset.view='status';
  progress(1);
  foot.classList.add('hidden');
  document.getElementById('step').textContent='Selesai';
  var next = STATE.stage==='T0'
    ? 'Anda kini boleh mula menggunakan AI-SAFER Simulator. Borang seterusnya akan terbuka melalui pautan yang sama setelah anda selesai.'
    : (STATE.stage==='T1'
      ? 'Sesi susulan akan terbuka empat minggu dari hari ini. Kami akan menghantar peringatan melalui emel. Simpan pautan yang sama.'
      : 'Ini sesi terakhir anda. Terima kasih atas sumbangan anda kepada kajian ini.');
  app.innerHTML='<div class="card center"><div class="big">\u2713</div><h2>Jawapan diterima</h2>'
    +'<p class="sub" style="margin-top:10px">'+next+'</p></div>';
}

/* ============ MULA ============ */
function renderBlocked(){
  document.body.dataset.view='status';
  var ok = own('ok')===true, stage = own('stage'), sub = own('sub');
  progress(stage==='SELESAI'?1:0);
  document.getElementById('step').textContent='';
  foot.classList.add('hidden');
  var icon = stage==='SELESAI'?'\u2713':(ok?'\u23F1':'\u26A0');
  app.innerHTML='<div class="card center"><div class="big">'+icon+'</div>'
    +'<h2>'+(ok?esc(own('nama')||'Terima kasih'):'Pautan tidak sah')+'</h2>'
    +'<p class="sub" style="margin-top:10px">'+esc(own('msg'))+'</p>'
    +(sub?'<p class="sub" style="margin-top:10px">'+esc(sub)+'</p>':'')
    +'</div>';
}

function renderMasuk(err){
  document.body.dataset.view='entry';
  progress(0);
  document.getElementById('step').textContent='';
  foot.classList.add('hidden');
  app.innerHTML='<div class="entry-grid">'
    +'<section class="story" aria-labelledby="welcome-title">'
    +'<span class="eyebrow">Kajian AI-SAFER · Fasa 3</span>'
    +'<h1 id="welcome-title">Bersedia menghadapi banjir.<br><em>Bermula dengan anda.</em></h1>'
    +'<p>Soal selidik pengetahuan, sikap dan amalan untuk memahami kesiapsiagaan anda menghadapi bencana banjir.</p>'
    +'<div class="study-pills"><span>± 12 minit setiap sesi</span><span>3 sesi kajian</span></div>'
    +'<ol class="session-path" aria-label="Tiga sesi kajian">'
    +'<li><span class="session-no">01 / T0</span><strong>Sebelum simulator</strong><small>Kenali kesiapsiagaan anda.</small></li>'
    +'<li><span class="session-no">02 / T1</span><strong>Selepas simulator</strong><small>Jawab selepas selesai.</small></li>'
    +'<li><span class="session-no">03 / T2</span><strong>4 minggu kemudian</strong><small>Kembali untuk sesi susulan.</small></li></ol></section>'
    +'<section class="card login-card" aria-labelledby="login-title">'
    +'<span class="eyebrow">Portal peserta · Soal selidik KAP</span>'
    +'<h2 id="login-title">Selamat datang.</h2>'
    +'<p class="sub">Masukkan nombor telefon yang didaftarkan untuk mula atau sambung sesi anda.</p>'
    +(err?'<div class="warn" role="alert" style="margin-top:18px">'+esc(err)+'</div>':'')
    +'<label class="f" for="masukTel">Nombor telefon berdaftar</label>'
    +'<input type="tel" id="masukTel" inputmode="tel" placeholder="Contoh: 0123456789" autocomplete="tel" aria-describedby="phone-privacy">'
    +'<p class="privacy-note" id="phone-privacy"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>Nombor telefon digunakan untuk mengenal pasti sesi dan tidak disimpan bersama jawapan anda.</span></p>'
    +'<button class="go" id="btnMasuk" style="width:100%;margin-top:18px">Teruskan</button>'
    +'<p class="login-help">Kembali untuk sesi seterusnya? Gunakan pautan dan nombor telefon yang sama. Jika perlukan bantuan, hubungi penyelidik.</p>'
    +'</section></div><p class="site-caption">AI-SAFER &nbsp;·&nbsp; Pengetahuan. Sikap. Amalan.</p>';

  var inp=document.getElementById('masukTel');
  var btn=document.getElementById('btnMasuk');
  function go(){
    var v=inp.value.trim();
    if(!v){ renderMasuk('Sila masukkan nombor telefon anda.'); return; }
    btn.disabled=true; btn.textContent='Menyemak…';
    apiCall('masuk', {input:v}, function(r){
      if(r&&r.ok){ STATE=r; confirmNama(); }
      else { renderMasuk((r&&r.msg)||'Tidak dapat menyemak. Cuba lagi.'); }
    });
  }
  btn.addEventListener('click',go);
  inp.addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
  // Do not open the phone keyboard before a mobile visitor chooses to type.
  if(err || window.matchMedia('(min-width: 701px)').matches) inp.focus({preventScroll:true});
}

function confirmNama(){
  document.body.dataset.view='status';
  app.innerHTML='<div class="card center" style="padding:44px 24px">'
    +'<p class="sub" style="margin-bottom:6px">Adakah ini anda?</p>'
    +'<h2 style="margin-bottom:22px">'+esc(own('nama'))+'</h2>'
    +'<button class="go" id="ya" style="width:100%">Ya, teruskan</button>'
    +'<button class="back" id="bukan" style="width:100%;margin-top:10px">Bukan saya</button>'
    +'</div>';
  document.getElementById('ya').addEventListener('click',boot);
  document.getElementById('bukan').addEventListener('click',function(){
    renderMasuk('Semak semula nombor telefon anda, atau hubungi penyelidik.');
  });
}

function boot(){
  var stage = own('stage');
  if(stage==='MASUK'){ renderMasuk(); return; }
  if(own('ok')!==true || ['TUNGGU','SELESAI','TUTUP'].indexOf(stage)>-1){ renderBlocked(); return; }

  var d = own('draft') || null;
  ans  = (d && d.ans)  || {};
  demo = (d && d.demo) || {tempat:[{a:'',b:''}], bencana:[{a:'',b:''}], latihan:[]};
  if(!demo.tempat)  demo.tempat=[{a:'',b:''}];
  if(!demo.bencana) demo.bencana=[{a:'',b:''}];
  if(!demo.latihan) demo.latihan=[];

  idx=0; t0=Date.now(); sending=false;
  btnNext.disabled=false;
  build(); render();
}

boot();
</script>
</body>
</html>
